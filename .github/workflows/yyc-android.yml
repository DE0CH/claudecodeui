# The YYC AI Android app (android/README.md): a WebView of the site, built as a release APK signed with the upload
# key, checked on a foldable emulator (the site loads signed out folded and unfolded, 「登入」 opens Chrome on Access's
# login, the keyboard shrinks the WebView). This repo is public:
# the server's address is the YYC_SITE secret, so the APK and the screenshots leave CI only age-encrypted to
# YYC_ANDROID_CI_AGE_KEY's recipient (claude-env scripts/yyc-android-apk.sh downloads and decrypts them).
name: yyc-android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/yyc-android.yml"

concurrency:
  group: yyc-android
  cancel-in-progress: false

permissions:
  contents: read

env:
  AGE_RECIPIENT: age12yv9zraqrhap54e0gqe6j38lcthysyhpz5x6c7dggxqkzjzdmeassp2849
  YYC_SITE: ${{ secrets.YYC_SITE }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: android/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate the Android project
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/upload.p12
          VERSION_CODE: ${{ github.run_number }}
          CI: "1"
        run: |
          : "${YYC_SITE:?the YYC_SITE secret is required}"
          npx expo prebuild --platform android --no-install --clean

      - name: Build the release APK
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/upload.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.YYC_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
          KEYSTORE_B64: ${{ secrets.YYC_ANDROID_UPLOAD_KEYSTORE }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE"
          cd android
          ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64
          rm -f "$ANDROID_KEYSTORE"
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$apk" | head -3
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$apk" "$GITHUB_WORKSPACE/out/yyc-ai.apk"
          # the keyboard test build (App.tsx TEST_PAGE): the same app with a local test page; only the JS changes
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE"
          YYC_TEST_PAGE=1 ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64
          rm -f "$ANDROID_KEYSTORE"
          cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" "$RUNNER_TEMP/yyc-ai-test.apk"
          ls -l "$GITHUB_WORKSPACE/out" "$RUNNER_TEMP/yyc-ai-test.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          # a foldable: folded it is a phone, unfolded a small tablet (emulator-test.sh folds it both ways)
          profile: pixel_fold
          disable-animations: true
          working-directory: android
          script: ./emulator-test.sh "$GITHUB_WORKSPACE/out/yyc-ai.apk" "$RUNNER_TEMP/yyc-ai-test.apk" "$GITHUB_WORKSPACE/out/screens"

      # the download in YYC AI's Settings (router GET /api/jarvis/android.apk reads this object): only a pushed build
      # that passed the emulator test
      - name: Publish the APK to the download
        if: github.event_name == 'push'
        working-directory: .
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YYC_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YYC_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: fsn1
          BUCKET: ${{ secrets.YYC_S3_BUCKET }}
        run: |
          aws s3 cp out/yyc-ai.apk "s3://$BUCKET/apps/yyc-ai-android.apk" \
            --endpoint-url https://fsn1.your-objectstorage.com \
            --content-type application/vnd.android.package-archive --no-progress

      - name: Encrypt the APK and screenshots
        if: always()
        working-directory: .
        run: |
          sudo apt-get install -y -qq age > /dev/null
          [ -d out ] || exit 0
          mv -f out/screens/ui.xml out/ui.xml 2>/dev/null || true
          tar -czf - -C out . | age -r "$AGE_RECIPIENT" > yyc-android.tar.age
          ls -l yyc-android.tar.age

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yyc-android-encrypted
          path: yyc-android.tar.age
          if-no-files-found: ignore
          retention-days: 30
