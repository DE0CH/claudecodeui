# The staff UI (paseo/, docs/paseo-ui.md): typecheck and every test suite of paseo/packages (the app's unit and browser
# projects, protocol, client, relay, highlight, plugin) and the bridge's, on every push touching it. YYC AI is test-first
# (claude-env yyc-ai skill): pigeon-app.yml and yyc-ios.yml call this workflow and build only after it passes.
name: paseo-ui

on:
  push:
    branches: [main]
    paths: ["paseo/**", "server/modules/paseo/**", ".github/workflows/paseo-ui.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: paseo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: npm ci
      - run: npm run build:app-deps
      - name: Typecheck the app
        run: npx tsgo --noEmit -p packages/app/tsconfig.json
      - name: Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      - name: App tests (unit and browser)
        working-directory: paseo/packages/app
        run: npx vitest run
      - name: Protocol, client, relay, highlight and plugin tests
        if: success() || failure()   # every suite reports, not only the first red one
        run: |
          set -e
          for p in protocol client relay highlight plugin; do
            echo "::group::$p"; (cd "packages/$p" && npx vitest run); echo "::endgroup::"
          done
      # The bridge's tests parse its replies with paseo/packages/protocol's schemas
      - name: Bridge tests
        if: success() || failure()   # every suite reports, not only the first red one
        working-directory: .
        run: |
          HUSKY=0 ELECTRON_SKIP_BINARY_DOWNLOAD=1 PUPPETEER_SKIP_DOWNLOAD=1 npm ci
          npx tsx --tsconfig server/tsconfig.json --test server/modules/paseo/tests/*.test.ts
