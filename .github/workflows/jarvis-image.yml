# The YYC AI UI image (jarvis/Dockerfile: this fork + jarvis/router.mjs) on every push to main:
# ghcr.io/de0ch/yyc-ai-ui:<first 12 characters of the commit>. Deployed from DE0CH/YYC yyc-ai/deploy (pin the tag).
# The upstream workflows in this folder run only on dispatch, releases or the electron-app branch, never here.
name: jarvis-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: jarvis-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Router tests
        run: node --test jarvis/test/router.test.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: jarvis/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/de0ch/yyc-ai-ui:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=yyc-ai-ui
          cache-to: type=gha,mode=max,scope=yyc-ai-ui
