# The YYC AI UI image (jarvis/Dockerfile: this fork + jarvis/router.mjs) on every push to main:
# ghcr.io/de0ch/yyc-ai-ui:<first 12 characters of the commit>. Deployed from DE0CH/YYC yyc-ai/deploy (pin the tag).
# The upstream workflows in this folder run only on dispatch, releases or the electron-app branch, never here.
name: jarvis-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: jarvis-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      # the schedules test's database (jarvis/test/schedules.test.mjs)
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Router tests
        run: node --test jarvis/test/router.test.mjs
      - name: Schedules (rules, the AI's API, firing; on Postgres)
        env:
          SCHEDULES_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
        run: |
          npm install --prefix "$RUNNER_TEMP/pg" --no-save --no-package-lock pg@8.23.1
          PG_MODULE="$RUNNER_TEMP/pg/node_modules/pg/lib/index.js" node --test jarvis/test/schedules.test.mjs
      - name: Move fuzz (sends, steers and Stops around a move with network delay, DESIGN 9.9)
        run: node --test jarvis/test/move-fuzz.test.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: jarvis/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/de0ch/yyc-ai-ui:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=yyc-ai-ui
          cache-to: type=gha,mode=max,scope=yyc-ai-ui
