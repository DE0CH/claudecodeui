# Temporary: what Chrome on Android paints an installed app's status bar with (scripts/web-install/experiment).
name: yyc-web-install-experiment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/web-install/experiment/**"
      - ".github/workflows/yyc-web-install-experiment.yml"

concurrency:
  group: yyc-web-install-experiment
  cancel-in-progress: false

permissions:
  contents: read

env:
  AGE_RECIPIENT: age12yv9zraqrhap54e0gqe6j38lcthysyhpz5x6c7dggxqkzjzdmeassp2849
  YYC_SITE: ${{ secrets.YYC_SITE }}

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: python3 scripts/web-install/experiment/run.py "$GITHUB_WORKSPACE/out/screens"

      - name: Encrypt the screenshots
        if: always()
        run: |
          sudo apt-get install -y -qq age > /dev/null
          [ -d out ] || exit 0
          tar -czf - -C out . | age -r "$AGE_RECIPIENT" > yyc-web-install.tar.age
          ls -l yyc-web-install.tar.age

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yyc-web-install-encrypted
          path: yyc-web-install.tar.age
          if-no-files-found: ignore
          retention-days: 30
