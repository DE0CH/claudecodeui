# The YYC AI iOS app (docs/paseo-ui.md): the same Paseo app as the website (paseo/), built natively, checked on the
# simulator (it starts on its sign-in screen), then archived unsigned, cloud-signed at export and uploaded to
# TestFlight as dev.de0ch.yycai (team S64YL394S3; the internal group "Owner" gets every build). This repo is public:
# the server's address is the YYC_SITE secret, never in the tree or the logs.
name: yyc-ios

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight after the simulator test"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "paseo/**"
      - ".github/workflows/yyc-ios.yml"

concurrency:
  group: yyc-ios
  cancel-in-progress: false

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  # Every step, not just prebuild: Xcode's "Bundle React Native code" phase re-reads app.config.js
  APP_VARIANT: production
  YYC_SITE: ${{ secrets.YYC_SITE }}

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 150
    defaults:
      run:
        working-directory: paseo
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: paseo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate the iOS project
        env:
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: ios/prepare.sh

      - name: Find the workspace
        run: |
          ws=$(ls -d packages/app/ios/*.xcworkspace | head -1)
          echo "WORKSPACE=$PWD/$ws" >> "$GITHUB_ENV"
          echo "SCHEME=$(basename "$ws" .xcworkspace)" >> "$GITHUB_ENV"

      - name: Build for the simulator
        working-directory: paseo/packages/app/ios
        run: |
          set -o pipefail
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build | tail -n 40

      - name: Simulator test
        timeout-minutes: 25
        run: ios/simulator-test.sh "$(ls -d packages/app/ios/build/sim/Build/Products/Release-iphonesimulator/*.app | head -1)"

      - name: Keep the test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test
          path: yyc-ios-test-output/
          if-no-files-found: ignore

      - name: Archive, sign and upload to TestFlight
        if: github.event_name == 'push' || inputs.upload
        working-directory: paseo/packages/app/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Archived UNSIGNED: signing it makes automatic signing mint an Apple Development certificate on every fresh
          # runner, and the team is at Apple's limit (claude-env lessons/75). The app is ad-hoc signed with its
          # entitlements, then the export cloud-signs it with the managed distribution certificate.
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=S64YL394S3 archive | tail -n 40
          app="$(ls -d "$RUNNER_TEMP"/app.xcarchive/Products/Applications/*.app | head -1)"
          ent_src="$(ls "$SCHEME"/*.entitlements 2>/dev/null | head -1 || true)"
          ent="$RUNNER_TEMP/app.entitlements"
          if [ -n "$ent_src" ]; then sed 's#<string>development</string>#<string>production</string>#' "$ent_src" > "$ent"; plutil -lint "$ent"; fi
          find "$app" \( -name "*.framework" -o -name "*.dylib" -o -name "*.appex" \) -print \
            | awk '{ print gsub("/", "/"), $0 }' | sort -rn | cut -d' ' -f2- | while IFS= read -r b; do
              codesign --force --sign - --timestamp=none "$b"
            done
          if [ -n "$ent_src" ]; then codesign --force --sign - --timestamp=none --entitlements "$ent" --generate-entitlement-der "$app"
          else codesign --force --sign - --timestamp=none "$app"; fi
          codesign --verify --deep --strict "$app"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/paseo/ios/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -n 40
          rm -f "$KEY"
